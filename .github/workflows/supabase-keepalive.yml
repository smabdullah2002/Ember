name: Supabase Keep-Alive Trigger

on:
  # Runs automatically at 00:00 UTC every 5 days (max gap = 5 days, under the 7-day pause limit)
  schedule:
    - cron: '0 0 */5 * *'
  # Allows manual triggering from the GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    name: Ping Supabase Database

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Verify secrets are configured
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_KEY secrets are not set. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Execute Keep-Alive Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/ping_supabase.py
